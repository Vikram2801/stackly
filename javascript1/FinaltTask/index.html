<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

            <div class="datetime">
                <span id="today"></span>
                <span id="currentTime"></span>
            </div>
        </header>


        <!-- SEARCH -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search employee..."
            >

            <button id="searchBtn">
                Search
            </button>

        </section>


        <!-- DEPARTMENT FILTER -->
        <section class="filter-section">

            <button class="department-btn active" data-department="All">
                All Employees
            </button>

            <button class="department-btn" data-department="IT">
                IT
            </button>

            <button class="department-btn" data-department="HR">
                HR
            </button>

            <button class="department-btn" data-department="Finance">
                Finance
            </button>

            <button class="department-btn" data-department="Marketing">
                Marketing
            </button>

        </section>


        <!-- STATUS MESSAGE -->
        <p id="statusMessage">
            Loading employees...
        </p>


        <!-- EMPLOYEE COUNT -->
        <section class="dashboard">

            <div class="dashboard-box">
                <h3>Employee Count</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="dashboard-box">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="dashboard-box">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="dashboard-box">
                <h3>Highest Paid</h3>
                <p id="highestSalary">No Data</p>
            </div>

        </section>


        <!-- SORT -->
        <section class="sort-section">

            <label for="sortSelect">
                Sort Employees:
            </label>

            <select id="sortSelect">

                <option value="default">
                    Default
                </option>

                <option value="nameAsc">
                    Name A → Z
                </option>

                <option value="nameDesc">
                    Name Z → A
                </option>

                <option value="ageAsc">
                    Age Low → High
                </option>

                <option value="ageDesc">
                    Age High → Low
                </option>

                <option value="salaryAsc">
                    Salary Low → High
                </option>

                <option value="salaryDesc">
                    Salary High → Low
                </option>

            </select>

        </section>


        <!-- EMPLOYEE CARDS -->
        <section>

            <div id="employeeContainer" class="employee-grid">
                <!-- Employee cards will be created here -->
            </div>

        </section>


        <!-- ADD EMPLOYEE -->
        <section class="add-section">

            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        id="nameInput"
                        placeholder="Enter employee name"
                    >

                    <small id="nameError"></small>

                </div>


                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        id="ageInput"
                        placeholder="Enter age"
                    >

                    <small id="ageError"></small>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="emailInput"
                        placeholder="Enter email"
                    >

                    <small id="emailError"></small>

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <select id="departmentInput">

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                    </select>

                    <small id="departmentError"></small>

                </div>


                <div class="form-group">

                    <label>Salary</label>

                    <input
                        type="number"
                        id="salaryInput"
                        placeholder="Enter salary"
                    >

                    <small id="salaryError"></small>

                </div>


                <button type="submit" class="add-btn">
                    Add Employee
                </button>

            </form>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
